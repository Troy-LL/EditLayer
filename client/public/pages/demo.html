<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page</title>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body>
  <div class="page" style="position:relative;box-sizing:border-box;margin:0 auto;padding:48px 24px;max-width:720px;min-height:100vh;background-color:#ffffff">
    <h1 style="color:#1a1a1a;font-size:40px;background-color:transparent;opacity:1;padding:0px;margin:0 0 20px;border-radius:0px;border:none;text-align:left;z-index:0;position:relative">Welcome to the demo page</h1>
    <p style="color:#444444;font-size:18px;background-color:transparent;opacity:1;padding:0px;margin:0 0 20px;border-radius:0px;border:none;text-align:left;z-index:0;position:relative">Click Edit, select this text, and change it. Save, then refresh.</p>
  </div>

</html>
